<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Paintings</title>
<style>
  :root {
    --bg: #1b1a18; --panel: #24221f; --ink: #ece7df; --muted: #8f887d;
    --love: #d9677a; --okay: #c9a24a; --nope: #6f6a62; --focus: #e8dcc6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
    padding: 14px 16px 18px; max-width: 900px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--panel); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--focus); transition: width .2s; }
  figure { margin: 0; display: grid; place-items: center; gap: 10px; min-height: 0; }
  figure img { width: min(100%, 72vh); aspect-ratio: 1; object-fit: contain; border-radius: 4px;
    background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  figcaption { color: var(--muted); text-align: center; }
  .current { margin-top: 2px; min-height: 1.4em; font-weight: 600; }
  .current.love { color: var(--love); } .current.okay { color: var(--okay); }
  .current.nope { color: var(--nope); }
  .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; padding: 14px 8px; border-radius: 8px; border: 1px solid #3a3732;
    background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: #5a554d; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button[data-tier="love"] { border-color: color-mix(in srgb, var(--love) 60%, #3a3732); }
  button[data-tier="okay"] { border-color: color-mix(in srgb, var(--okay) 60%, #3a3732); }
  kbd { font: 12px ui-monospace, monospace; color: var(--muted); margin-left: 6px; }
  .help { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  .empty { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px 0; }
  .status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  @media (max-width: 520px) { button { padding: 12px 4px; } kbd { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <strong>Rate paintings</strong>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="progress" id="progress">loading&hellip;</div>
  </header>

  <figure id="stage">
    <img id="img" alt="">
    <figcaption>
      <div id="subject"></div>
      <div class="current" id="current"></div>
    </figcaption>
  </figure>

  <div>
    <div class="buttons">
      <button data-tier="love">Love<kbd>1</kbd></button>
      <button data-tier="okay">Okay<kbd>2</kbd></button>
      <button data-tier="nope">Nope<kbd>3</kbd></button>
    </div>
    <div class="help">&larr; / &rarr; move &middot; space skip &middot; z undo last &middot; ratings save automatically</div>
    <div class="status" id="status"></div>
  </div>
</main>

<script>
/* Rating tool for generated paintings.

   Deliberately shows only the painting and its subject -- not the round, the
   generator or the gate metrics -- so none of those anchor the judgement.
   Order is shuffled across batches for the same reason: rating round 0, 1, 2 of
   one flower back to back invites comparing versions instead of judging each.

   Ratings save to gen/ratings.json after every keypress through the dev
   server's /save endpoint (python serve.py). */

const RATINGS_PATH = "gen/ratings.json";
const params = new URLSearchParams(location.search);
let paintings = [], ratings = {}, order = [], pos = 0, history = [];

const $ = (id) => document.getElementById(id);

function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

async function load() {
  const all = params.get("all") === "1" ? "?all=1" : "";
  paintings = await fetch("/api/paintings" + all).then(r => r.json());
  try {
    const r = await fetch("/" + RATINGS_PATH);
    if (r.ok) ratings = await r.json();
  } catch (_) {}

  // Stable shuffle, unrated first: resuming a session continues where it left off.
  const rng = mulberry32(20260925);
  const shuffled = paintings.map((p, i) => [rng(), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const unrated = shuffled.filter(i => !ratings[paintings[i].key]);
  const rated = shuffled.filter(i => ratings[paintings[i].key]);
  order = unrated.concat(rated);
  pos = 0;
  render();
}

function counts() {
  const c = { love: 0, okay: 0, nope: 0 };
  for (const p of paintings) { const t = ratings[p.key] && ratings[p.key].tier; if (t) c[t]++; }
  return c;
}

function render() {
  if (!paintings.length) {
    $("stage").innerHTML = '<div class="empty">No paintings yet.<br>Pull a generation branch into gen/out/ and reload.</div>';
    $("progress").textContent = "0 paintings";
    return;
  }
  const p = paintings[order[pos]];
  const r = ratings[p.key];
  $("img").src = "/" + p.png;
  $("img").alt = "Painting of " + (p.subject || "a flower");
  $("subject").textContent = p.subject || "";
  $("current").textContent = r ? "rated: " + r.tier : "";
  $("current").className = "current" + (r ? " " + r.tier : "");
  const c = counts(), done = c.love + c.okay + c.nope;
  $("progress").textContent =
    `${pos + 1} / ${paintings.length} · rated ${done} · love ${c.love} · okay ${c.okay} · nope ${c.nope}`;
  $("bar").style.width = (100 * done / paintings.length) + "%";
}

async function save() {
  try {
    const res = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: RATINGS_PATH, json: ratings }) });
    const j = await res.json();
    $("status").textContent = j.ok ? "" : "Save failed: " + j.error;
  } catch (e) {
    $("status").textContent = "Save failed -- is python serve.py running?";
  }
}

function rate(tier) {
  if (!paintings.length) return;
  const p = paintings[order[pos]];
  history.push([p.key, ratings[p.key] || null, pos]);
  ratings[p.key] = { tier, subject: p.subject, ts: new Date().toISOString() };
  save();
  if (pos < order.length - 1) pos++;
  render();
}

function undo() {
  const last = history.pop();
  if (!last) return;
  const [key, prev, at] = last;
  if (prev) ratings[key] = prev; else delete ratings[key];
  pos = at;
  save();
  render();
}

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "1") rate("love");
  else if (k === "2") rate("okay");
  else if (k === "3") rate("nope");
  else if (k === "ArrowRight" || k === " ") { e.preventDefault(); pos = Math.min(pos + 1, order.length - 1); render(); }
  else if (k === "ArrowLeft") { pos = Math.max(pos - 1, 0); render(); }
  else if (k === "z") undo();
});
document.querySelectorAll("button[data-tier]").forEach(b =>
  b.addEventListener("click", () => rate(b.dataset.tier)));

load();
</script>
</body>
</html>
